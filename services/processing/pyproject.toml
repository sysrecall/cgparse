[project]
name = "processing"
version = "0.1.0"
description = "Celery workers: route, parse (pdf/OCR/xlsx), LLM extraction, validate, index"
requires-python = ">=3.12"
dependencies = [
    "app-core",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "openparser-sdk>=1.0",
    "openai>=1.35",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=10.3",
    "python-dateutil>=2.9",
    "python-magic>=0.4.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "moto[s3]>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv.sources]
app-core = { path = "../../packages/app-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
