[project]
name = "api"
version = "0.1.0"
description = "FastAPI service: upload, reads, corrections, hybrid search, SSE"
requires-python = ">=3.12"
dependencies = [
    "app-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",  # producer-only: send_task to the processing queues
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    # Bundles libmagic.so.1 + magic.mgc in the wheel, so no system libmagic is
    # needed on hosts that can't apt-get install libmagic1 (Render native runtime).
    "python-magic-standalone>=0.4.29",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv.sources]
app-core = { path = "../../packages/app-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI idiom: Depends/File in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
